# 2D digital-twin scene for room E-470. Exactly one entry, with the id "scene".
#
# Source: docs/Lab-Map.png and docs/UiS_Lab_Interactive_3D.html (Nov 2026).
# Units: metres. Origin: north-west floor corner. x runs west → east, y runs north → south
# (towards the viewer), z up. So the north glass wall is the back wall, the west wall is the
# left wall, and E-470B is the cut-out front-right (south-east) corner.
#
# Fixed from the map: room 8.9 × 8.77 m, ceiling 2.6 m, E-470B, capture area, 10 camera
# positions, desk row, cabinets, sink, doors.
# Still provisional (TODO-content.md): the 2 unplaced cameras, and where the movable items
# (thermal tripods, radio stands) and the planned devices stand.
scene:
  placeholder: false
  room:
    width: 8.9
    depth: 8.77
    height: 2.6
    back_wall: glass
    exclude:
      - { x: 6.1, y: 5.9, w: 2.8, d: 2.87, label: { en: "E-470B · not part of the lab", no: "E-470B · ikke en del av laben" } }
    doors:
      - { x: 1.0, w: 1.0 }
      - { x: 6.6, w: 1.0 }
      - { x: 8.14, w: 0.63 }
    notes:
      - { x: 4.45, y: 0, z: 2.75, text: { en: "North · glass wall", no: "Nord · glassvegg" } }
  objects:
    # --- installed ---------------------------------------------------------------
    # 10 of the 12 PrimeX 22 cameras, as plotted on the map (ceiling, ~2.4 m).
    - object: optitrack_cameras
      kind: camera-array
      x: 0.65
      y: 0.40
      z: 2.55
      w: 5
      d: 8
      h: 0.19
      points: [[0.96, 0.62], [2.94, 0.62], [5.35, 0.62], [0.83, 2.75], [5.35, 2.75], [0.83, 5.77], [5.35, 5.77], [0.86, 8.17], [3.08, 8.17], [5.35, 8.17]]
    # Control station: lab workstation with two 28-inch monitors (0.62 × 0.37 m) at the north end of the desk row.
    - { object: gpu_workstation, kind: pc, x: 5.92, y: 2.62, z: 0.81, w: 0.06, d: 0.62, h: 0.37 }
    # Samsung 98-inch display (≈ 2.17 × 1.22 m) on the west wall, facing the control station (confirmed; height provisional).
    - { object: wall_display, kind: box, x: 0.0, y: 3.3, z: 0.9, w: 0.07, d: 2.17, h: 1.22 }
    # Portable systems are kept in the equipment cabinets (provisional shelf).
    - { object: wireless_emg, kind: box, x: 8.25, y: 4.25, z: 1.73, w: 0.42, d: 0.5, h: 0.12 }
    - { object: vr_headset, kind: box, x: 8.27, y: 2.75, z: 1.73, w: 0.38, d: 0.45, h: 0.16 }
    # PROVISIONAL: movable tripods / stands, proposed set-ups.
    - { object: thermal_camera_wide, kind: tripod, x: 3.05, y: 0.08, w: 0.22, d: 0.22, h: 1.6 }
    - { object: thermal_camera_narrow, kind: tripod, x: 5.1, y: 4.3, w: 0.2, d: 0.2, h: 1.25 }
    - { object: sdr_b210, kind: tripod, x: 0.22, y: 2.3, w: 0.2, d: 0.2, h: 1.4 }
    - { object: sdr_b310, kind: tripod, x: 0.22, y: 6.2, w: 0.2, d: 0.2, h: 1.4 }
    # --- decoration ----------------------------------------------------------------
    # Desk row; the three southern positions are extra seats (the control station takes the northern end).
    - { kind: operator-desk, x: 5.82, y: 1.40, w: 0.6, d: 4.3, h: 0.81, count: 3 }
    - { kind: cabinets, x: 8.17, y: 1.89, w: 0.59, d: 3.74, h: 1.73, count: 5 }
    - { kind: box, x: 0.2, y: 0.19, w: 0.47, d: 0.52, h: 0.86 }
    - { kind: person, x: 2.9, y: 5.4, w: 0.45, d: 0.3, h: 1.75 }
    # --- planned (drawn ghosted; positions provisional) ----------------------------
    - { object: force_platforms, kind: plate, x: 2.55, y: 3.5, w: 1.2, d: 1.8, h: 0.04 }
    - { object: microphone_array, kind: box, x: 2.75, y: 4.0, z: 2.5, w: 0.8, d: 0.8, h: 0.05 }
    - { object: uwb_rtls, kind: anchors, x: 0.15, y: 0.15, z: 2.3, w: 8.6, d: 8.45, h: 0.12, points: [[0.15, 0.15], [8.6, 0.15], [0.15, 8.5], [5.85, 8.5]] }
    - { object: screen_eye_tracker, kind: box, x: 5.9, y: 3.45, z: 0.81, w: 0.1, d: 0.4, h: 0.04 }
