name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Schema + relation validation happen during the build: a device without a status
      # or researcher, or a link to an unknown id, fails here with the file name.
      - name: Type check
        run: npm run check
      - name: Build (validates all content)
        run: npm run build

      - name: Colour contrast (design tokens)
        run: npm run test:contrast
      - name: Internal links
        run: npm run test:links
      # Retries: this step needs the Ubuntu package mirrors, which occasionally fail to resolve on the runner.
      - name: Install Chromium for axe
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install failed (attempt $i), retrying in 20 s…"; sleep 20
          done
          exit 1
      - name: Accessibility (axe, every page, light + dark)
        run: npm run test:a11y
      - name: Lighthouse (mobile, performance + accessibility ≥ 90)
        run: npm run test:lighthouse
